<style>
  :root {
    --tl-bg: rgba(255, 255, 255, 0.6);
    --tl-blur: blur(10px);
    --tl-border-soft: rgba(0, 0, 0, 0.06);
    --tl-shadow-soft: 0 4px 14px rgba(0, 0, 0, 0.06);
    --tl-shadow-hover: 0 8px 22px rgba(0, 0, 0, 0.10);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding: 1rem 1rem 0rem;
  }

  /* ===== Layout ===== */

  .tl-root {
    padding: 2.5rem 0 0rem;
  }

  .tl-meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    /* margin-bottom: 2rem; */
  }

  .tl-scroll {
    overflow-x: auto;
    padding-bottom: 1rem;
  }

  .tl-canvas {
    position: relative;
    min-height: 20px;
  }

  .tl-lanes {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .tl-lane {
    position: relative;
    height: 60px;
  }

  /* ===== Header ===== */

  .tl-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .tl-sub {
    margin-top: 4px;
    font-size: 12px;
    opacity: 0.6;
  }

  /* ===== Legend ===== */

  .tl-legend {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    opacity: 0.85;
    transition: opacity 0.2s;
  }

  .leg-item:hover {
    opacity: 1;
  }

  .leg-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .leg-dash {
    width: 16px;
    height: 2px;
    border-top: 2px dashed rgba(0, 0, 0, 0.2);
  }

  /* ===== Timeline Bars ===== */

  .tl-bar-outer {
    position: absolute;
    top: 0;
    height: 60px;
  }

  .tl-bar {
    position: relative;
    height: 100%;
    min-width: 120px;
    border-radius: 14px;
    border: 1px solid var(--tl-border-soft);
    background: var(--tl-bg);
    backdrop-filter: var(--tl-blur);
    box-shadow: var(--tl-shadow-soft);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
    overflow: hidden;
    transition: all 0.25s ease;
  }

  .tl-bar:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: var(--tl-shadow-hover);
    border-color: rgba(0, 0, 0, 0.12);
  }

  /* Stripe */

  .tl-bar-stripe {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    opacity: 0.9;
  }

  /* Text */

  .tl-bar-content {
    padding-left: 10px;
    overflow: hidden;
  }

  .tl-bar-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tl-bar-range {
    font-size: 11px;
    margin-top: 4px;
    opacity: 0.65;
  }

  /* ===== Tooltip ===== */

  .tl-tip {
    position: fixed;
    z-index: 99999;
    pointer-events: none;

    min-width: 200px;
    max-width: 240px;
    padding: 14px 16px;

    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(12px);
    border: 1px solid var(--tl-border-soft);
    border-radius: 14px;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
  }

  .tl-bar-outer:hover .tl-tip {
    display: block;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateX(-50%) translateY(6px);
    }

    to {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  }

  .tip-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .tip-date {
    font-size: 11px;
    margin-bottom: 8px;
    opacity: 0.7;
  }

  .tip-desc {
    font-size: 12px;
    line-height: 1.5;
    opacity: 0.85;
  }

  .tip-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
  }

  /* ===== Today Line ===== */

  .tl-today {
    position: absolute;
    top: 0;
    width: 2px;
    background: linear-gradient(to bottom, #378ADD, transparent);
    box-shadow: 0 0 8px rgba(55, 138, 221, 0.4);
  }

  .tl-today-label {
    position: absolute;
    top: -22px;
    transform: translateX(-50%);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #E6F1FB;
    color: #185FA5;
  }

  /* ===== Grid + Scroll ===== */

  #gridlines div {
    opacity: 0.25;
  }

  .tl-scroll::-webkit-scrollbar {
    height: 8px;
  }

  .tl-scroll::-webkit-scrollbar-thumb {
    background: rgba(0, 0, 0, 0.15);
    border-radius: 999px;
  }

  .tl-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 0, 0, 0.25);
  }
</style>

    const DAY = 86400000;
    const PPD = 3.2;
    const now = new Date();

    PROJECTS.forEach(p => { p.s = new Date(p.start); p.e = p.end ? new Date(p.end) : now; });
    PROJECTS.sort((a, b) => a.s - b.s);

    let minD = new Date(Math.min(...PROJECTS.map(p => p.s)));
    let maxD = new Date(Math.max(...PROJECTS.map(p => p.e)));
    minD.setDate(1);
    maxD.setMonth(maxD.getMonth() + 2); maxD.setDate(1);

    function px(d) { return Math.round(((d - minD) / DAY) * PPD); }
    function fmt(d) { return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
    function fmtShort(d) { return d.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }); }

    const lanes = [];
    PROJECTS.forEach(p => {
      let placed = false;
      for (let i = 0; i < lanes.length; i++) {
        const last = lanes[i][lanes[i].length - 1];
        if ((p.s - last.e) >= DAY * 30) { lanes[i].push(p); p.lane = i; placed = true; break; }
      }
      if (!placed) { p.lane = lanes.length; lanes.push([p]); }
    });

    const totalPx = px(maxD) + 40;
    const canvas = document.getElementById('canvas');
    canvas.style.width = totalPx + 'px';

    const axis = document.getElementById('axis');
    const gridlines = document.getElementById('gridlines');
    let cur = new Date(minD);
    while (cur <= maxD) {
      const left = px(cur);
      const lbl = document.createElement('div');
      lbl.style.cssText = `position:absolute;left:${left}px;top:0;display:flex;flex-direction:column;align-items:flex-start;`;
      const line = document.createElement('div');
      line.style.cssText = `width:0.5px;height:10px;background:var(--color-border-tertiary);`;
      const txt = document.createElement('div');
      txt.style.cssText = `font-size:10px;color:var(--color-text-tertiary);white-space:nowrap;padding-top:3px;transform:translateX(-50%);`;
      txt.textContent = fmtShort(cur);
      lbl.appendChild(line); lbl.appendChild(txt); axis.appendChild(lbl);

      const gl = document.createElement('div');
      gl.style.cssText = `position:absolute;left:${left}px;top:0;bottom:0;width:0.5px;background:var(--color-border-tertiary);`;
      gridlines.appendChild(gl);

      cur = new Date(cur); cur.setMonth(cur.getMonth() + 2);
    }

    const todayPx = px(now);
    const todayEl = document.createElement('div');
    todayEl.className = 'tl-today';
    todayEl.style.cssText = `left:${todayPx}px;top:-28px;bottom:0;`;
    const todayLbl = document.createElement('div');
    todayLbl.className = 'tl-today-label';
    todayLbl.textContent = 'today';
    todayEl.appendChild(todayLbl);
    canvas.appendChild(todayEl);

    const lanesDiv = document.getElementById('lanes');
    for (let i = 0; i < lanes.length; i++) {
      const laneDiv = document.createElement('div');
      laneDiv.className = 'tl-lane';
      lanes[i].forEach(p => {
        const left = px(p.s);
        const rawW = (p.e - p.s) / DAY * PPD;
        const width = Math.max(rawW, 120);
        const ongoing = !p.end;

        const outer = document.createElement('div');
        outer.className = 'tl-bar-outer';
        outer.style.cssText = `left:${left}px;width:${width}px;`;

        const bar = document.createElement('div');
        bar.className = 'tl-bar';
        if (ongoing) { bar.style.borderStyle = 'dashed'; bar.style.borderColor = p.color + '80'; }

        const stripe = document.createElement('div');
        stripe.className = 'tl-bar-stripe';
        stripe.style.background = p.color;

        const content = document.createElement('div');
        content.className = 'tl-bar-content';

        const name = document.createElement('div');
        name.className = 'tl-bar-name';
        name.textContent = p.title;

        const range = document.createElement('div');
        range.className = 'tl-bar-range';
        range.textContent = fmtShort(p.s) + ' → ' + (p.end ? fmtShort(p.e) : 'now');

        content.appendChild(name);
        content.appendChild(range);
        bar.appendChild(stripe);
        bar.appendChild(content);

        const tip = document.createElement('div');
        tip.className = 'tl-tip';
        //     tip.innerHTML = `
        //   <div class="tip-name">${p.title}</div>
        //   <div class="tip-date">${fmt(p.s)} → ${p.end ? fmt(p.e) : 'ongoing'}</div>

        // `;
        tip.innerHTML = `...`;

        const tipHTML = `
  <div class="tip-name">${p.title}</div>
  <div class="tip-date">${fmt(p.s)} → ${p.end ? fmt(p.e) : 'ongoing'}</div>
  <div class="tip-desc">${p.desc}</div>
  <span class="tip-badge" style="background:${p.bgLight};color:${p.textColor};">${p.cat}</span>
  ${ongoing ? `<span class="tip-badge" style="background:#E6F1FB;color:#185FA5;margin-left:4px;">active</span>` : ''}
`;

        outer.appendChild(bar);
        // outer.appendChild(tip);
        laneDiv.appendChild(outer);

        outer.addEventListener('mouseenter', () => {
          globalTip.innerHTML = tipHTML;
          globalTip.style.display = 'block';
        });

        outer.addEventListener('mousemove', (e) => {
          const padding = 12;

          const tipW = globalTip.offsetWidth;
          const tipH = globalTip.offsetHeight;

          let x = e.clientX + padding;
          let y = e.clientY - tipH - padding;

          if (x + tipW > window.innerWidth) {
            x = window.innerWidth - tipW - padding;
          }

          if (y < 0) {
            y = e.clientY + padding;
          }

          globalTip.style.left = x + 'px';
          globalTip.style.top = y + 'px';
        });

        outer.addEventListener('mouseleave', () => {
          globalTip.style.display = 'none';
        });
      });
      lanesDiv.appendChild(laneDiv);
    }

    const globalTip = document.getElementById('global-tip');

    document.querySelectorAll('.tl-bar-outer').forEach(el => {

        const tipH = globalTip.offsetHeight;

        let x = e.clientX + padding;

          x = window.innerWidth - tipW - padding;
        }

        // oben raus verhindern
        if (y < 0) {
          y = e.clientY + padding;
        }

        globalTip.style.left = x + 'px';
        globalTip.style.top = y + 'px';
      });

        globalTip.style.display = 'none';
      });
