name: Build & Deploy Astro Site

on:
  push:
    branches:
      - site

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installieren
        run: npm ci

      - name: Astro build
        run: npm run build

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build-Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy zu GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
